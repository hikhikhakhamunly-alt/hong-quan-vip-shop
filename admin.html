<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - HỒNG QUÂN VIP</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hidden {
      display: none !important;
    }

    .admin-panel {
      max-width: 600px;
      margin: auto;
    }

    .notice {
      color: #ffe3a0;
      background: #33270b;
      border: 1px solid #9b7422;
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <span class="tag">HỒNG QUÂN VIP SYSTEM</span>
      <h1>QUẢN TRỊ <span>ADMIN</span></h1>
      <p>Đăng nhập dành cho quản trị viên.</p>
    </header>

    <section class="panel admin-panel" id="loginPanel">
      <h2>Đăng nhập Admin</h2>

      <form id="loginForm">
        <label for="adminUser">Tên tài khoản</label>
        <input id="adminUser" required autocomplete="username">

        <label for="adminPassword">Mật khẩu</label>
        <input
          id="adminPassword"
          type="password"
          required
          autocomplete="current-password"
        >

        <button id="loginBtn" type="submit">Đăng nhập</button>
        <p id="loginStatus" class="status" aria-live="polite"></p>
      </form>

      <a class="text-link" href="index.html">← Về trang chủ</a>
    </section>

    <section class="panel hidden" id="dashboard">
      <h2>Đăng nhập thành công</h2>

      <div class="notice">
        Đăng nhập đã được xác nhận. Chức năng tải và quản lý đơn hàng
        cần API quản trị có xác thực riêng.
      </div>

      <button id="logoutBtn" type="button">Đăng xuất</button>
    </section>

    <footer>© HỒNG QUÂN VIP</footer>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyo2SpfFhAUXmB-H5cFBXem6DL4un1WhRXn8zo2QmAmrjynl4rPzQmoqPMccoXvvYYUJQ/exec";

    const loginForm = document.getElementById("loginForm");
    const loginPanel = document.getElementById("loginPanel");
    const dashboard = document.getElementById("dashboard");
    const loginStatus = document.getElementById("loginStatus");
    const loginBtn = document.getElementById("loginBtn");

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      loginBtn.disabled = true;
      loginStatus.textContent = "Đang kiểm tra...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "login",
            username: document.getElementById("adminUser").value.trim(),
            password: document.getElementById("adminPassword").value
          })
        });

        const result = await response.json();

        if (!result.success) {
          throw new Error("Sai tài khoản hoặc mật khẩu.");
        }

        loginPanel.classList.add("hidden");
        dashboard.classList.remove("hidden");

      } catch (error) {
        loginStatus.textContent =
          error.message || "Không kết nối được máy chủ.";
      } finally {
        loginBtn.disabled = false;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      dashboard.classList.add("hidden");
      loginPanel.classList.remove("hidden");
      loginForm.reset();
      loginStatus.textContent = "";
    });
  </script>
</body>
</html>
