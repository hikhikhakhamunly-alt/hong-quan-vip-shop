
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký dịch vụ - HỒNG QUÂN VIP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>ĐĂNG KÝ DỊCH VỤ</h1>
    <a href="index.html">← Trang chủ</a>
  </header>

  <main class="container">
    <form id="orderForm" class="panel">
      <label for="name">Họ và tên</label>
      <input id="name" name="name" required placeholder="Nhập họ tên">

      <label for="contact">Thông tin liên hệ</label>
      <input id="contact" name="contact" required placeholder="Email hoặc cách liên hệ">

      <label for="message">Nội dung yêu cầu</label>
      <textarea id="message" name="message" required
        placeholder="Mô tả dịch vụ bạn cần"></textarea>

      <button type="submit">Gửi yêu cầu</button>
      <p id="result" role="status"></p>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
