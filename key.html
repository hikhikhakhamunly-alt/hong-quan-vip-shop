
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt key - HỒNG QUÂN VIP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>ĐẶT MUA KEY</h1>
    <a href="index.html">← Trang chủ</a>
  </header>

  <main class="container">
    <form id="keyForm" class="panel">
      <label for="name">Họ và tên</label>
      <input id="name" name="name" required placeholder="Nhập họ tên">

      <label for="contact">Thông tin liên hệ</label>
      <input id="contact" name="contact" required
        placeholder="Email hoặc cách liên hệ">

      <label for="plan">Chọn gói</label>
      <select id="plan" name="plan" required>
        <option value="">-- Chọn gói --</option>
        <option value="1 tháng">1 tháng</option>
        <option value="2 tháng">2 tháng</option>
        <option value="3 tháng">3 tháng</option>
        <option value="Trọn đời">Trọn đời</option>
      </select>

      <label for="message">Ghi chú</label>
      <textarea id="message" name="message"
        placeholder="Thông tin bổ sung (nếu có)"></textarea>

      <button type="submit">Gửi yêu cầu đặt key</button>
      <p id="result" role="status"></p>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
